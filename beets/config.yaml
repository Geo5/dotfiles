directory: ~/Music
library: ~/Data/musiclibrary.db
import:
  move: yes
  incremental_skip_later: yes
  bell: yes
ui:
  color: yes
musicbrainz:
  genres: yes
pluginpath:
  - /home/georg/git/beet-summarize/beetsplug
  - /home/georg/git/BeetsPluginYearFixer/beetsplug
  - /home/georg/git/BeetsPluginAutofix/beetsplug
  - /home/georg/git/BeetsPluginDescribe/beetsplug

plugins: fromfilename chroma embedart fetchart replaygain scrub fish thumbnails fuzzy permissions lastgenre duplicates missing info summarize bpd autofix yearfixer describe convert mbsync bareasc unimported

replaygain:
  backend: ffmpeg

thumbnails:
  dolphin: yes

convert:
  copy_album_art: yes
  auto: no
  format: flac
  delete_originals: no

unimported:
  ignore_extensions: directory db db-shm db-wal log md

fetchart:
  cover_format: JPEG
  max_filesize: 6000000
  quality: 75

